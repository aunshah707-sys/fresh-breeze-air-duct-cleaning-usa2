<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Fill (clean crisp white or subtle rounded backdrop for high contrast on any browser theme) -->
    <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#004e92" />
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#48bb78" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="ductBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="40%" stopColor="#0f3d6c" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <linearGradient id="ductRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Crisp White Background Circle for browser tab visibility in dark & light themes -->
  <circle cx="256" cy="256" r="248" fill="#ffffff" />

  <!-- Outer Emblem Circular Ring -->
  <!-- Top/Right Vibrant Green Arc -->
  <path d="M 230 46 A 210 210 0 0 1 426 312" fill="none" stroke="#22c55e" stroke-width="26" stroke-linecap="round" />

  <!-- Bottom/Left Deep Royal Blue Arc -->
  <path d="M 170 82 A 210 210 0 1 0 354 446" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" />

  <!-- Central House Silhouette (Navy Blue) -->
  <g id="house" fill="#0c3b6d">
    <!-- Roof with sharp gable -->
    <path d="M 148 184 L 244 114 L 340 184 L 322 198 L 244 140 L 166 198 Z" />
    <!-- Main House Body Wall -->
    <path d="M 166 194 L 244 136 L 322 194 L 322 242 C 304 240 286 242 270 248 L 270 248 L 166 248 Z" />
    
    <!-- 4 Sky Blue Window Panes -->
    <rect x="224" y="162" width="17" height="17" rx="2" fill="#38bdf8" />
    <rect x="247" y="162" width="17" height="17" rx="2" fill="#38bdf8" />
    <rect x="224" y="185" width="17" height="17" rx="2" fill="#38bdf8" />
    <rect x="247" y="185" width="17" height="17" rx="2" fill="#38bdf8" />
  </g>

  <!-- Fresh Green Sprouting Leaves on the Left -->
  <g id="leaves">
    <!-- Main leaf -->
    <path d="M 68 202 C 68 202 82 170 114 176 C 116 204 92 220 68 202 Z" fill="#4ade80" />
    <!-- Secondary leaf -->
    <path d="M 96 178 C 96 178 116 150 144 160 C 144 186 118 198 96 178 Z" fill="#22c55e" />
  </g>

  <!-- Airflow Breeze Waves Flowing Across Bottom -->
  <g id="breeze-waves" stroke-linecap="round">
    <!-- Top Sky Blue Wave -->
    <path d="M 76 244 C 126 200 200 206 264 246" fill="none" stroke="#0ea5e9" stroke-width="18" />
    <!-- Middle Royal Blue Wave -->
    <path d="M 74 274 C 130 228 194 238 266 276" fill="none" stroke="#0284c7" stroke-width="15" />
    <!-- Bottom Vibrant Green Wave -->
    <path d="M 112 308 C 164 266 218 274 272 302" fill="none" stroke="#22c55e" stroke-width="17" />
  </g>

  <!-- Cylindrical Air Duct Vent Opening on the Right -->
  <g id="air-duct" transform="translate(10, 0)">
    <!-- Duct Cylinder Body Outer Shadow & Shading -->
    <path d="M 288 180 C 274 190 262 216 262 248 C 262 280 274 306 288 316 L 324 316 C 308 306 296 280 296 248 C 296 216 308 190 324 180 Z" fill="#0c3b6d" />
    
    <!-- Outer Metal Rim Flange -->
    <ellipse cx="330" cy="248" rx="44" ry="68" fill="#0f3d6c" stroke="#38bdf8" stroke-width="7" />
    
    <!-- Inner Duct Opening Cavity -->
    <ellipse cx="336" cy="248" rx="34" ry="56" fill="#032b4f" />
    <ellipse cx="340" cy="248" rx="26" ry="46" fill="#021d36" />
    
    <!-- Metal Specular Reflection Rim Highlight -->
    <path d="M 314 200 C 302 216 298 238 298 254 C 298 272 304 290 316 304" fill="none" stroke="#bae6fd" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Clean Air Currents Flowing Out of Duct to the Right -->
  <g id="exhaust-breeze" stroke-linecap="round">
    <!-- Stream 1 -->
    <path d="M 348 226 C 390 206 430 226 470 216" fill="none" stroke="#0ea5e9" stroke-width="12" />
    <!-- Stream 2 -->
    <path d="M 352 250 C 400 236 436 260 484 248" fill="none" stroke="#0284c7" stroke-width="11" />
    <!-- Stream 3 -->
    <path d="M 360 274 C 398 266 430 288 474 280" fill="none" stroke="#38bdf8" stroke-width="10" />
  </g>

  <!-- Sparkling Clean Air Stars / Glints -->
  <g id="sparkles" fill="#38bdf8">
    <!-- Star 1 (Top Right) -->
    <path d="M 420 186 C 420 196 426 202 436 202 C 426 202 420 208 420 218 C 420 208 414 202 404 202 C 414 202 420 196 420 186 Z" />
    <!-- Star 2 (Far Right) -->
    <path d="M 464 200 C 464 207 468 211 475 211 C 468 211 464 215 464 222 C 464 215 460 211 453 211 C 460 211 464 207 464 200 Z" />
    <!-- Star 3 (Bottom Right) -->
    <path d="M 450 286 C 450 293 454 297 461 297 C 454 297 450 301 450 308 C 450 301 446 297 439 297 C 446 297 450 293 450 286 Z" />
    <!-- Star 4 (Inside Duct Opening) -->
    <path d="M 342 226 C 342 230 345 233 349 233 C 345 233 342 236 342 240 C 342 236 339 233 335 233 C 339 233 342 230 342 226 Z" fill="#ffffff" />
    <path d="M 360 262 C 360 265 362 267 365 267 C 362 267 360 269 360 272 C 360 269 358 267 355 267 C 358 267 360 265 360 262 Z" fill="#ffffff" />
  </g>
</svg>
